<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TikTok terhubung</title>
</head>
<body style="font-family:sans-serif;max-width:600px;margin:40px auto;padding:0 16px">
  <h3>Hampir selesai ✅</h3>
  <p>Salin seluruh teks di bawah ini, lalu kirim ke yang memasang bot.</p>
  <textarea id="u" rows="7" style="width:100%" readonly></textarea>
  <p><button onclick="navigator.clipboard.writeText(document.getElementById('u').value);this.textContent='Tersalin ✔'">Salin</button></p>
  <script>document.getElementById('u').value = location.href;</script>
</body>
</html>
